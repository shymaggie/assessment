name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10：生产宿主机（Ubuntu 22.04）系统 python3；3.11：guest 镜像；3.12/3.13：前向兼容
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies (locked)
      run: uv sync --group dev --frozen --python ${{ matrix.python-version }}

    - name: Lint (ruff incl. security rules) and byte-compile
      run: make lint

    - name: Tests with coverage gate (unit + property + contract + end-to-end)
      run: make cov

    - name: rules.json <-> 01_rules.md rule-ID consistency
      run: make rules-check

    - name: Integrity pins are current (run `make pin` after reviewed changes)
      run: make integrity

  probe:
    name: retest-probe (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Probe library + entry smoke tests (egress allowlist, DNS-rebinding guard, body cap, rate limit)
      run: node --test "services/retest-probe/test/*.test.js"
    - name: Entry script is executable (supervisor execs it directly)
      run: test -x services/retest-probe/bin/probe.js

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Shell syntax
      run: bash -n deploy/bootstrap.sh && bash -n tools/harden_workspace.sh
    - name: Bootstrap dry-run
      run: DRY_RUN=1 CALCULATOR_PKG=/tmp/calc ENV_FILE=/tmp/ci.env deploy/bootstrap.sh

  docker:
    runs-on: ubuntu-latest
    needs: [python, probe]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t agent-assessment:ci .

    - name: Verify image
      run: docker run --rm agent-assessment:ci python3 -c "import sys; print('Python', sys.version)"
